[tool.black]
line-length = 99
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 99
multi_line_output = 3

[tool.ruff]
line-length = 99
# Regras base recomendadas
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = []

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --tb=short"
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
